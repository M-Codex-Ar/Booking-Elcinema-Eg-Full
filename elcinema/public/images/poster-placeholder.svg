<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default poster artwork (2:3). Shown whenever a card has no artwork, its URL is
  dead, or the load fails. Colours mirror src/theme/tokens.css (.dark) as hex —
  an SVG asset cannot read CSS custom properties, so this is the one documented
  exception to the "no colour literals outside tokens.css" rule. If the palette
  changes, update these four files by hand from the same oklch values.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="No poster available">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#121416"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#25aae1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#25aae1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#08090b" stop-opacity="0"/>
      <stop offset="1" stop-color="#08090b" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect width="300" height="450" fill="url(#glow)"/>
  <g transform="translate(118 168)" fill="none" stroke="#f0f2f4" stroke-opacity="0.78" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 46h70a6 6 0 0 1 6 6v34a6 6 0 0 1-6 6H4a6 6 0 0 1-6-6V52a6 6 0 0 1 6-6Z" transform="translate(-4 -6)"/>
    <path d="M-2 40 8 18l70 8-8 20Z" transform="translate(0 -6)"/>
    <path d="M14 18 22 2M38 22 46 6M62 26 70 10" transform="translate(0 -6)"/>
  </g>
  <rect x="126" y="272" width="48" height="4" rx="2" fill="#ecb417"/>
  <text x="150" y="320" text-anchor="middle" font-family="Exo, Cairo, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="1" fill="#f0f2f4">elCinema</text>
  <text x="150" y="348" text-anchor="middle" font-family="Cairo, 'Segoe UI', sans-serif" font-size="15" fill="#f0f2f4" fill-opacity="0.62">لا تتوافر بوسترات · No poster</text>
  <rect width="300" height="450" fill="url(#shade)"/>
</svg>
