frontend:
  - changed-files:
      - any-glob-to-any-file: "elcinema/src/**"
workflows:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
api:
  - changed-files:
      - any-glob-to-any-file: "server-api/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/pnpm-lock.yaml"
security:
  - changed-files:
      - any-glob-to-any-file:
          - "**/auth/**"
          - "**/security/**"
          - "**/*.sql"
