name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure configured labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'frontend', color: '1d76db', description: 'Frontend application changes' },
              { name: 'workflows', color: '5319e7', description: 'CI and release automation' },
              { name: 'documentation', color: '0075ca', description: 'Documentation changes' },
              { name: 'api', color: '0e8a16', description: 'API contract changes' },
              { name: 'dependencies', color: '0366d6', description: 'Dependency updates' },
              { name: 'security', color: 'b60205', description: 'Security-sensitive changes' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
      - name: Apply labels from changed paths
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
