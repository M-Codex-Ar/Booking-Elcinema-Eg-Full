name: API CI (planned)

# server-api/ is specification-only. This workflow is written and ready: once the first
# commit adds src/UnifiedControlCenter.Api/UnifiedControlCenter.Api.csproj, delete the
# `solution-present` guard's exit and the pipeline starts enforcing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server-api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Restore · build · test · format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Guard — implementation not started
        run: |
          if ! ls src/*/*.csproj >/dev/null 2>&1; then
            echo "::notice title=API not implemented yet::server-api/ holds the blueprint only. See server-api/README.md."
            exit 0
          fi
          echo "Solution present — continuing with the real pipeline."

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-incremental

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=api.trx"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: server-api/**/TestResults/*.trx
          if-no-files-found: ignore
