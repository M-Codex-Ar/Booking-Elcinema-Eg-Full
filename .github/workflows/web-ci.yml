name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "elcinema/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "elcinema/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · typecheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elcinema
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: elcinema/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Production build
        # CI carries no Supabase values, so the build-time env gate is opted out
        # here. The artifact of this job is a compile check only — it is NOT a
        # deployable bundle. Release builds happen where elcinema/.env exists
        # (locally, or Lovable Cloud, which injects its own values).
        env:
          SKIP_ENV_CHECK: "1"
        run: pnpm run build

      - name: Note on the uploaded artifact
        run: |
          echo "::notice::web-output was built without SUPABASE env; it is compile-verified only."

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-output
          path: elcinema/.output
          retention-days: 7
          if-no-files-found: warn

  route-tree-drift:
    name: Route tree is committed and current
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: elcinema
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: elcinema/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # src/routeTree.gen.ts is committed and imported directly; a renamed route file
      # without a regenerated tree breaks the build in production only. Fail it in CI.
      - name: Regenerate route tree and assert no diff
        run: |
          pnpm run build >/dev/null 2>&1 || true
          git diff --exit-code src/routeTree.gen.ts \
            || { echo "::error::src/routeTree.gen.ts is stale — commit the regenerated file."; exit 1; }
        env:
          CI: "true"
          SKIP_ENV_CHECK: "1"