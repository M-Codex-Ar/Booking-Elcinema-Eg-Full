name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "**.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  links:
    name: Internal links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --max-redirects 2
            --exclude '^https?://' --exclude 'PROJECT_REF'
            README.md AGENTS.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
            docs scripts server-api elcinema/README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
